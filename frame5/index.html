<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>ACR Store Screen Frame v5 White Glow</title>
<!--
  ACR Supply store TV frame, v2 "touch up" (Nov 16, 2026).
  Full-screen bottom layer in TPM. TPM zones for this layout: Zone 1 x32 y32 1440x810; card x1504 y100 384x280; sports x1504 y408 384x640
  and the Screenfeed sports zone (x 1528..1910, y 392..1074) sit on top of it.
  Edit the CONFIG block and push to update every store.
-->
<style>
@font-face{font-family:Alpino;src:url(assets/Alpino-Bold.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:Alpino;src:url(assets/Alpino-Black.woff2) format("woff2");font-weight:900;font-display:block}
@font-face{font-family:Expose;src:url(assets/Expose-Bold.woff2) format("woff2");font-weight:700;font-display:block}
#stage{--accent:#006EB7;--accent-glow:rgba(0,110,183,.45)}
#b2{background:#003f73!important;opacity:.5!important}
#stage.thanks{--accent:#F7941D;--accent-glow:rgba(247,148,29,.65)}
html,body{margin:0;padding:0;background:#00467A;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(1300px 900px at 15% 0%,#2a93e0 0%,rgba(42,147,224,0) 60%),
             radial-gradient(1100px 800px at 100% 100%,#004a85 0%,rgba(0,74,133,0) 65%),
             linear-gradient(160deg,#0a7fd1 0%,#006EB7 45%,#00508c 100%)}
/* slow liquid light blobs */
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
#b1{width:900px;height:700px;left:-200px;top:-200px;background:#7cc4f5;opacity:.45;animation:d1 38s ease-in-out infinite alternate}
#b2{width:800px;height:800px;left:1200px;top:500px;background:#b9d9f5;opacity:.6;animation:d2 46s ease-in-out infinite alternate}
#b3{width:700px;height:420px;left:520px;top:760px;background:#4fb0f0;opacity:.35;animation:d3 52s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(260px,160px)}}
@keyframes d2{to{transform:translate(-300px,-180px)}}
@keyframes d3{to{transform:translate(220px,-120px)}}
#grain{position:absolute;inset:0;opacity:.06;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 1px,transparent 1px 3px)}
#logo{position:absolute;left:32px;top:922px;width:280px;filter:drop-shadow(0 0 18px rgba(255,255,255,.95))}
/* ===== v3 liquid glass ===== */
.glass{position:absolute;border-radius:24px;
  background:linear-gradient(160deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.16) 45%,rgba(255,255,255,.22) 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.95),        /* top highlight */
    inset 0 0 0 1.5px rgba(255,255,255,.7),     /* glass rim */
    0 0 26px rgba(255,255,255,.55),             /* white glow */
    0 0 70px rgba(255,255,255,.28),
    0 20px 50px rgba(0,30,70,.35)}
.glass:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%)}
/* bezels: TPM zones sit inside these like screens in glass */
#bzMain{left:22px;top:22px;width:1460px;height:830px;border-radius:26px}
#bzSports{left:1494px;top:398px;width:404px;height:660px;border-radius:26px}
/* top right card, rounded glass edge */
#cardwrap{position:absolute;left:1494px;top:94px;width:404px;height:292px;border-radius:26px}
#card{position:absolute;left:10px;top:6px;width:384px;height:280px;border-radius:18px;overflow:hidden;
  background:url(assets/thank-you-card-still.png) 0 0/382px 280px}
#card img{width:384px;height:280px;display:block}
/* clock pill */
#clock{position:absolute;left:1494px;top:22px;width:404px;height:58px;border-radius:29px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;box-sizing:border-box;font-family:Expose;font-weight:700;font-size:28px;letter-spacing:1px;color:#0B2A4A;text-transform:uppercase}
#clock .d{color:var(--accent)}
/* ticker bar */
#bar{position:absolute;left:350px;top:918px;width:1132px;height:92px;border-radius:46px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.75) 50%,rgba(232,243,252,.85) 100%)}
#bar .glow{position:absolute;left:90px;right:90px;bottom:7px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,rgba(95,176,234,0),var(--accent) 50%,rgba(95,176,234,0));
  box-shadow:0 0 16px var(--accent-glow)}
#bar .sheen{position:absolute;top:0;bottom:0;width:220px;left:-260px;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0));
  animation:sheen 14s linear infinite}
@keyframes sheen{0%{transform:translateX(0)}22%{transform:translateX(1700px)}100%{transform:translateX(1700px)}}
#tick{position:absolute;left:34px;right:34px;top:0;height:92px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 50px,#000 calc(100% - 50px),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 50px,#000 calc(100% - 50px),transparent 100%)}
#crawl{position:absolute;left:0;top:0;height:92px;display:flex;align-items:center;white-space:nowrap;will-change:transform}
#crawl .m{font-family:Alpino;font-weight:700;font-size:38px;color:#0B2A4A;letter-spacing:.3px}
#crawl .s{display:inline-block;width:10px;height:10px;border-radius:50%;background:#006EB7;margin:0 46px;flex:none}
#stage.thanks #b3{background:#FFBE7A;opacity:.7}
#stage.thanks #b1{background:#FFF1E2}
#stage.thanks .glass{box-shadow:inset 0 2px 0 #fff,inset 0 0 0 1.5px rgba(255,255,255,.9),0 0 40px #fff,0 0 70px rgba(247,148,29,.32),0 18px 48px rgba(20,60,110,.16)}
/* orange hairline along the top of each glass panel */
.glass:before{content:"";position:absolute;left:36px;right:36px;top:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,rgba(0,0,0,0),var(--accent) 50%,rgba(0,0,0,0));opacity:1;box-shadow:0 0 10px var(--accent-glow)}
/* one message at a time */
#crawl{transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .6s ease}
#crawl.out{opacity:0}
/* v5c: bottom row aligned, glass pills, readable orange */
#plate{position:absolute;left:22px;top:903px;width:304px;height:104px;border-radius:30px;
  background:linear-gradient(180deg,#ffffff,#eef6fd)!important;
  box-shadow:inset 0 0 0 1.5px #fff,0 0 26px rgba(255,255,255,.55),0 16px 40px rgba(0,30,70,.35)!important}
#logo{left:46px!important;top:921px!important;width:256px!important;filter:none!important}
#bar{top:903px!important;height:104px!important;border-radius:30px!important;
  background:linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,.10) 50%,rgba(255,255,255,.16)),rgba(0,50,95,.55)!important}
#tick,#crawl{height:104px!important}
#crawl .m{color:#fff!important;font-size:40px!important;text-shadow:0 2px 12px rgba(0,30,70,.5)}
#bar .glow{left:220px!important;right:220px!important;bottom:14px!important;height:4px!important;opacity:1;
  background:linear-gradient(90deg,rgba(255,165,61,0),#FFA53D 25%,#FFA53D 75%,rgba(255,165,61,0))!important;box-shadow:0 0 16px rgba(255,165,61,.9)!important}
#bar .sheen{display:none}
#clock{background:linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,.10) 50%,rgba(255,255,255,.16)),rgba(0,50,95,.55)!important;color:#fff!important}
#clock .d{color:#FFB257!important}
.glass:before,#bar:before,#clock:before{display:none!important}
#cardwrap{background:linear-gradient(170deg,#ffffff,#e4f1fb 50%,#cfe6f7)!important}

/* ===== top right: Thank You card and live weather take turns ===== */
#tyimg{position:absolute;left:0;top:0;transition:opacity .8s ease}
#wx{position:absolute;inset:0;color:#fff;transition:opacity .8s ease;
  background:radial-gradient(260px 200px at 85% 0%,rgba(124,196,245,.55),rgba(124,196,245,0) 70%),linear-gradient(165deg,#0b74c4 0%,#00518f 55%,#003766 100%)}
#wx.hide,#tyimg.hide{opacity:0}
#wxTop{position:absolute;left:22px;right:20px;top:34px;display:flex;justify-content:space-between;align-items:center}
#wxLive{font-family:Expose;font-weight:700;font-size:18px;letter-spacing:2px;color:#FFB257}
#wxDots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);margin-left:6px}
#wxDots i.on{background:#fff;box-shadow:0 0 8px #fff}
#wxStore{position:absolute;left:22px;top:18px;font-family:Alpino;font-weight:900;font-size:36px;letter-spacing:.3px}
#wxMid{position:absolute;left:18px;right:18px;top:78px;height:104px;display:flex;align-items:center}
#wxIcon{width:96px;height:96px;flex:none}
#wxIcon svg{width:96px;height:96px;display:block}
#wxTemp{margin-left:14px;font-family:Alpino;font-weight:900;font-size:96px;line-height:1;text-shadow:0 4px 20px rgba(0,30,70,.45)}
#wxSky{position:absolute;left:22px;right:18px;top:184px;font-family:Alpino;font-weight:700;font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#E3F1FC}
#wxBot{position:absolute;left:0;right:0;bottom:0;height:46px;padding:0 22px;display:flex;justify-content:space-between;align-items:center;
  background:rgba(0,30,60,.38);font-family:Expose;font-weight:700;font-size:26px;letter-spacing:1px}
#wxBot span:first-child{color:#fff}#wxBot span:last-child{color:#FFB257}
#wxStore,#wxMid,#wxSky,#wxBot span{transition:opacity .5s ease,transform .5s ease}
#wx.swap #wxStore,#wx.swap #wxMid,#wx.swap #wxSky,#wx.swap #wxBot span{opacity:0;transform:translateY(8px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-3px)}50%{transform:translateX(4px)}}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(14px);opacity:0}}
.sunR{transform-origin:48px 48px;animation:spin 40s linear infinite}
.cl{animation:drift 7s ease-in-out infinite}
.dr{animation:fall 1.4s linear infinite}
#leaves{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
  <canvas id="leaves" width="1920" height="1080"></canvas>
  <div class="glass" id="plate"></div>
  <img id="logo" src="assets/acr-logo-color.png" alt="ACR Supply Co.">
  <div class="glass" id="bzMain"></div>
  <div class="glass" id="bzSports"></div>
  <div class="glass" id="cardwrap"><div id="card"><img id="tyimg" src="assets/thank-you-card.gif" alt="">
    <div id="wx" class="hide">
      <div id="wxTop"><span id="wxLive"></span><span id="wxDots"></span></div>
      <div id="wxStore"></div>
      <div id="wxMid"><div id="wxIcon"></div><div id="wxTemp"></div></div>
      <div id="wxSky"></div>
      <div id="wxBot"><span id="wxLow"></span><span id="wxPop"></span></div>
    </div></div></div>
  <div class="glass" id="clock"><span class="d" id="date"></span><span id="time"></span></div>
  <div class="glass" id="bar"><div class="sheen"></div><div id="tick"><div id="crawl"></div></div><div class="glow"></div></div>
</div>
<script>
/* ===== CONFIG ===== */
var TICKER = [
  "Thank You for Choosing ACR Supply",
  "We Appreciate Your Business",
  "8 Stores Across North Carolina, One Team Behind You",
  "Get Deals First: Ask the Counter About ACR Text Alerts",
  "Find Us on Your Feed: Search ACR Supply",
  {text:"Deer Contest: Show Us Your Buck at the Counter or Message Us on Social", until:"2027-01-01"}
];
var RELOAD_HOURS = 6;
var CARD_SECONDS = 12;      /* Thank You card shows this long */
var STORES_PER_TURN = 8;    /* then this many stores of live weather (all 8, about a minute) */
var STORE_SECONDS = 7;      /* each store shows this long */
var LEAVES_UNTIL = "2026-11-30";   /* falling leaves stop the day the Christmas look starts */
/* ================== */
(function(){
  var stage=document.getElementById('stage');
  function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+s+')';}
  addEventListener('resize',fit);fit();

  var D=['SUN','MON','TUE','WED','THU','FRI','SAT'],M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function clock(){var n=new Date(),h=n.getHours(),m=n.getMinutes(),ap=h<12?'AM':'PM';h=h%12||12;
    document.getElementById('time').textContent=h+':'+(m<10?'0':'')+m+' '+ap;
    document.getElementById('date').textContent=D[n.getDay()]+' '+M[n.getMonth()]+' '+n.getDate();}
  clock();setInterval(clock,10000);

  var today=new Date();today.setHours(0,0,0,0);
  var lines=TICKER.filter(function(t){if(typeof t==='string')return true;
    if(t.from&&today<new Date(t.from+'T00:00:00'))return false;
    if(t.until&&today>=new Date(t.until+'T00:00:00'))return false;return true;})
    .map(function(t){return typeof t==='string'?t:t.text});


  /* ===== live weather (NWS) taking turns with the Thank You card ===== */
  (function(){
    var STORES=[["Winston-Salem","RAH",15,65],["Greensboro","RAH",32,66],["Burlington","RAH",44,68],["Durham","RAH",64,66],
      ["Carrboro","RAH",58,61],["Raleigh","RAH",75,57],["Greenville","MHX",30,95],["Wilmington","ILM",89,75]];
    var KEY='acrFrameWx1',data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){data={};}
    function get(u){return fetch(u,{headers:{'Accept':'application/geo+json'},cache:'no-store'}).then(function(r){if(!r.ok)throw r.status;return r.json();});}
    function load(s){var b='https://api.weather.gov/gridpoints/'+s[1]+'/'+s[2]+','+s[3];
      return Promise.all([get(b+'/forecast'),get(b+'/forecast/hourly')]).then(function(r){var now=Date.now();
        var h=r[1].properties.periods,p=r[0].properties.periods.filter(function(x){return Date.parse(x.endTime)>now;});
        var c=h.filter(function(x){return Date.parse(x.startTime)<=now&&Date.parse(x.endTime)>now;})[0]||h[0];
        var night=p.filter(function(x){return !x.isDaytime;})[0],day=p.filter(function(x){return x.isDaytime;})[0];
        var pop=function(x){return x&&x.probabilityOfPrecipitation&&x.probabilityOfPrecipitation.value||0;};
        data[s[0]]={t:c.temperature,sky:c.shortForecast,day:c.isDaytime,lo:night?night.temperature:null,hi:day?day.temperature:null,
          pop:Math.max(pop(p[0]),pop(p[1])),at:now};});}
    function refresh(){var i=0;(function next(){if(i>=STORES.length){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}return;}
      load(STORES[i++]).catch(function(){}).then(function(){setTimeout(next,600);});})();}
    refresh();setInterval(refresh,15*60*1000);
    function icon(sky,day){sky=(sky||'').toLowerCase();
      var sun='<g class="sunR"><circle cx="48" cy="48" r="17" fill="#FFC94A"/>'+[0,45,90,135,180,225,270,315].map(function(a){return '<rect x="46" y="12" width="4" height="12" rx="2" fill="#FFC94A" transform="rotate('+a+' 48 48)"/>';}).join('')+'</g>';
      var moon='<path d="M58 22a26 26 0 1 0 18 40A22 22 0 0 1 58 22z" fill="#E3F1FC"/>';
      var cloud=function(x,y,o){return '<g class="cl" opacity="'+(o||1)+'"><path d="M'+(x+14)+' '+(y+30)+'h40a14 14 0 0 0 0-28 20 20 0 0 0-38-4 13 13 0 0 0-2 32z" fill="#fff"/></g>';};
      var drops=function(c){var s='';for(var k=0;k<3;k++)s+='<rect class="dr" style="animation-delay:'+(k*.45)+'s" x="'+(30+k*16)+'" y="70" width="'+(c?7:4)+'" height="'+(c?7:12)+'" rx="'+(c?3.5:2)+'" fill="'+(c?'#fff':'#7cc4f5')+'"/>';return s;};
      var g;
      if(/thunder|storm/.test(sky))g=cloud(14,28)+'<path d="M50 62l-10 18h9l-5 14 15-20h-9l6-12z" fill="#FFC94A"/>';
      else if(/snow|flurr|sleet|ice/.test(sky))g=cloud(14,26)+drops(true);
      else if(/rain|shower|drizzle/.test(sky))g=cloud(14,26)+drops(false);
      else if(/fog|haze|mist/.test(sky))g='<g fill="#E3F1FC">'+[34,48,62].map(function(y,k){return '<rect class="cl" x="'+(16+k*6)+'" y="'+y+'" width="'+(60-k*6)+'" height="6" rx="3"/>';}).join('')+'</g>';
      else if(/partly|mostly sunny|mostly clear|few clouds|partly cloudy/.test(sky))g=(day?sun:moon)+cloud(22,40);
      else if(/cloud|overcast/.test(sky))g=cloud(4,20,.75)+cloud(20,38);
      else g=day?sun:moon;
      return '<svg viewBox="0 0 96 96">'+g+'</svg>';}
    var wx=document.getElementById('wx'),ty=document.getElementById('tyimg'),si=0;
    var dots=document.getElementById('wxDots');dots.innerHTML=STORES.map(function(){return '<i></i>';}).join('');
    function fill(s){var d=data[s[0]];document.getElementById('wxStore').textContent=s[0];
      document.getElementById('wxTemp').textContent=d.t+'°';document.getElementById('wxSky').textContent=d.sky;
      document.getElementById('wxIcon').innerHTML=icon(d.sky,d.day);
      document.getElementById('wxLow').textContent=(d.day&&d.hi!=null?'HIGH '+d.hi:'TONIGHT '+(d.lo!=null?d.lo:'--'))+'°';
      document.getElementById('wxPop').textContent='RAIN '+d.pop+'%';
      [].forEach.call(dots.children,function(e,k){e.className=STORES[k]===s?'on':'';});}
    function fresh(s){var d=data[s[0]];return d&&Date.now()-d.at<6*3600*1000;}
    function card(){wx.className='hide';ty.className='';setTimeout(weather,CARD_SECONDS*1000);}
    function weather(){var list=[],k=0;while(list.length<STORES_PER_TURN&&k<STORES.length){var s=STORES[si%STORES.length];si++;k++;if(fresh(s))list.push(s);}
      if(!list.length){setTimeout(weather,CARD_SECONDS*1000);return;}   /* no weather yet: keep the card up */
      var j=0;fill(list[0]);wx.className='';ty.className='hide';
      (function step(){j++;if(j>=list.length){setTimeout(card,STORE_SECONDS*1000);return;}
        setTimeout(function(){wx.className='swap';setTimeout(function(){fill(list[j]);wx.className='';step();},550);},STORE_SECONDS*1000);})();}
    setTimeout(weather,CARD_SECONDS*1000);
  })();
  /* ===== falling leaves (behind the glass) ===== */
  (function(){
    if(LEAVES_UNTIL&&today>=new Date(LEAVES_UNTIL+'T00:00:00'))return;
    var cv=document.getElementById('leaves'),cx=cv.getContext('2d');
    var P=[50,0,58,18,70,10,67,33,88,24,81,40,99,45,83,57,90,68,67,63,64,74,54,63,53,88,47,88,46,63,36,74,33,63,10,68,17,57,1,45,19,40,12,24,33,33,30,10,42,18];
    var COLS=['#F7941D','#FFA53D','#E8692A','#F2B33D','#C9502A'];
    var sprites=COLS.map(function(c){var o=document.createElement('canvas');o.width=o.height=104;var g=o.getContext('2d');
      g.translate(2,2);g.beginPath();g.moveTo(P[0],P[1]);for(var k=2;k<P.length;k+=2)g.lineTo(P[k],P[k+1]);g.closePath();
      g.fillStyle=c;g.fill();g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.6;
      g.beginPath();g.moveTo(50,88);g.lineTo(50,12);g.moveTo(50,58);g.lineTo(84,30);g.moveTo(50,58);g.lineTo(16,30);g.moveTo(50,66);g.lineTo(88,62);g.moveTo(50,66);g.lineTo(12,62);g.stroke();
      return o;});
    function mk(top){return{x:Math.random()*1920,y:top?Math.random()*1080:-80-Math.random()*300,s:40+Math.random()*34,
      v:38+Math.random()*40,sw:30+Math.random()*50,ph:Math.random()*6.28,fr:.4+Math.random()*.7,r:Math.random()*6.28,
      rv:(Math.random()-.5)*1.2,sp:sprites[(Math.random()*sprites.length)|0],a:.8+Math.random()*.2};}
    var L=[];for(var k=0;k<26;k++)L.push(mk(true));
    var last=null,acc=0;
    function f(t){requestAnimationFrame(f);if(last===null){last=t;return;}var dt=(t-last)/1000;last=t;if(dt>.2)dt=.2;
      acc+=dt;if(acc<1/30)return;dt=acc;acc=0;                     /* ~30 fps is plenty for slow leaves */
      cx.clearRect(0,0,1920,1080);
      for(var k=0;k<L.length;k++){var l=L[k];l.y+=l.v*dt;l.ph+=l.fr*dt;l.r+=l.rv*dt;
        var x=l.x+Math.sin(l.ph)*l.sw;if(l.y>1140)L[k]=mk(false);
        cx.save();cx.globalAlpha=l.a;cx.translate(x,l.y);cx.rotate(l.r);cx.scale(Math.cos(l.ph*1.3),1);
        cx.drawImage(l.sp,-l.s/2,-l.s/2,l.s,l.s);cx.restore();}}
    requestAnimationFrame(f);
  })();
  var crawl=document.getElementById('crawl'), box=document.getElementById('tick');
  var HOLD=7000, CRAWL=70, i=0;
  function show(){
    var l=lines[i%lines.length]; i++;
    crawl.className='out'; crawl.style.transition='none';
    crawl.innerHTML='<span class="m"></span>'; crawl.firstChild.textContent=l;
    var bw=box.clientWidth, w=crawl.scrollWidth, start=Math.max(0,(bw-w)/2);
    crawl.style.transform='translate3d('+start+'px,26px,0)';
    void crawl.offsetWidth;
    crawl.style.transition=''; crawl.className='';
    crawl.style.transform='translate3d('+start+'px,0,0)';
    var extra=w>bw-60? (w-(bw-60)) : 0;
    var t=HOLD;
    if(extra){ /* long line: read the start, then glide to the end */
      setTimeout(function(){crawl.style.transition='transform '+(extra/CRAWL)+'s linear';
        crawl.style.transform='translate3d('+(-extra-30)+'px,0,0)';},2500);
      t=2500+extra/CRAWL*1000+3000;
    }
    setTimeout(function(){crawl.style.transition='';crawl.className='out';
      crawl.style.transform=crawl.style.transform.replace(/,\s*0px,|,0,/,',-26px,');},t);
    setTimeout(show,t+700);
  }
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(show);

  /* Seasonal accent: add a date here to turn on orange (class 'thanks'). Off by Anthony's call Nov 16: full white glow + ACR blue. */
  var ACCENT_THANKS_UNTIL='';
  if(ACCENT_THANKS_UNTIL&&today<new Date(ACCENT_THANKS_UNTIL+'T23:59:59'))document.getElementById('stage').classList.add('thanks');
  setTimeout(function(){location.reload();},RELOAD_HOURS*3600*1000);
})();
</script>
</body>
</html>
